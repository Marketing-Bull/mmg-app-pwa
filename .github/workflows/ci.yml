name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets you re-run checks by hand without pushing an empty commit.
  workflow_dispatch:

# A new push to a PR makes the in-flight run irrelevant — cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, types, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Guards against regressions a green build can hide — a route 404ing or a
      # button silently vanishing from the rendered HTML.
      - name: Smoke test
        run: npm run smoke
